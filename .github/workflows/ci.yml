name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, build e lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` não funciona neste repositório: o package-lock.json está fora de
      # sincronia com o package.json e o comando aborta com "can only install packages
      # when your package.json and package-lock.json are in sync". Trocar para `npm ci`
      # assim que o lockfile for regenerado — o build passa a ser reproduzível.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build

      # O lint tem erros pré-existentes (majoritariamente @typescript-eslint/no-explicit-any).
      # Bloquear aqui faria a CI nascer vermelha e treinar todo mundo a ignorá-la, então
      # por ora ele é sinal, não portão. Tornar bloqueante (removendo o continue-on-error)
      # assim que a dívida for zerada.
      - name: Lint (informativo)
        continue-on-error: true
        run: npx eslint .
