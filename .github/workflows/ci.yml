name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, build e lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` instala exatamente o que está no lockfile: build reproduzível e falha
      # explícita se package.json e package-lock.json divergirem.
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build

      # O lint tem erros pré-existentes (majoritariamente @typescript-eslint/no-explicit-any).
      # Bloquear aqui faria a CI nascer vermelha e treinar todo mundo a ignorá-la, então
      # por ora ele é sinal, não portão. Tornar bloqueante (removendo o continue-on-error)
      # assim que a dívida for zerada.
      - name: Lint (informativo)
        continue-on-error: true
        run: npx eslint .
